name: 🛰️ PR Auto-Scan :: What Changed

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  update-pr-body:
    name: 🖥️ system-scan :: update-pr-body
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Build changed-files summary
        id: summary
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          git diff --name-status "$BASE_SHA" "$HEAD_SHA" > /tmp/changes.txt

          TOTAL=$(wc -l < /tmp/changes.txt | tr -d ' ')
          ADDED=$(grep -c '^A' /tmp/changes.txt || true)
          REMOVED=$(grep -c '^D' /tmp/changes.txt || true)
          RENAMED=$(grep -c '^R' /tmp/changes.txt || true)
          MODIFIED=$(( TOTAL - ADDED - REMOVED - RENAMED ))

          # Group by top-level folder, then render as a box-drawing "manifest tree"
          TREE=$(awk '{
            status=$1; file=$2;
            if (status ~ /^R/) { file=$3 }
            split(file, parts, "/");
            folder = (length(parts) > 1) ? parts[1] : "(root)";
            print folder "\t" status "\t" file
          }' /tmp/changes.txt | sort | awk -F'\t' '
            {
              if ($1 != prev) {
                if (prev != "") print "└─"
                print "┌─[ " $1 "/ ]"
                prev = $1
              }
              tag = ($2 ~ /^A/) ? "[+]" : ($2 ~ /^D/) ? "[-]" : ($2 ~ /^R/) ? "[>]" : "[~]"
              print "│ " tag "  " $3
            }
            END { if (prev != "") print "└─" }
          ')

          {
            echo "SUMMARY<<EOF"
            echo "╔══════════════════════════════════════════╗"
            echo "║  ⚡ AUTO_DIFF::SCAN_COMPLETE ⚡             ║"
            echo "╚══════════════════════════════════════════╝"
            echo ""
            echo "![FILES](https://img.shields.io/badge/FILES__TOUCHED-$TOTAL-00FFFF?style=for-the-badge) ![ADDED](https://img.shields.io/badge/ADDED-$ADDED-39FF14?style=for-the-badge) ![MODIFIED](https://img.shields.io/badge/MODIFIED-$MODIFIED-FFD500?style=for-the-badge) ![REMOVED](https://img.shields.io/badge/REMOVED-$REMOVED-FF003C?style=for-the-badge)"
            echo ""
            echo "<details open>"
            echo "<summary>🖥️ <code>manifest.log</code> — click to toggle full diff tree</summary>"
            echo ""
            echo '```'
            echo "$TREE"
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 📡 Update PR body
        uses: actions/github-script@v7
        env:
          SUMMARY: ${{ steps.summary.outputs.SUMMARY }}
        with:
          script: |
            const summary = process.env.SUMMARY || "";
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const body = pr.body || "";
            const startMarker = "## What Changed";
            const endMarkerRegex = /\n##\s/;

            const startIdx = body.indexOf(startMarker);
            if (startIdx === -1) {
              console.log('⚠️  NO "## What Changed" SECTION DETECTED — ABORTING SCAN.');
              return;
            }

            const afterStart = startIdx + startMarker.length;
            const rest = body.slice(afterStart);
            const nextHeadingMatch = rest.match(endMarkerRegex);
            const sectionEnd = nextHeadingMatch
              ? afterStart + nextHeadingMatch.index
              : body.length;

            const before = body.slice(0, afterStart);
            const after = body.slice(sectionEnd);

            // Preserve any existing manual checklist lines (lines starting with "- [")
            const existingSection = body.slice(afterStart, sectionEnd);
            const manualLines = existingSection
              .split("\n")
              .filter(line => line.trim().startsWith("- ["))
              .join("\n");

            const autoBlockRegex = /<!-- auto-summary-start -->[\s\S]*?<!-- auto-summary-end -->/;
            const autoBlock = `<!-- auto-summary-start -->\n${summary}\n<!-- auto-summary-end -->`;

            let newSection;
            if (autoBlockRegex.test(existingSection)) {
              newSection = existingSection.replace(autoBlockRegex, autoBlock);
            } else {
              newSection = `\n\n${autoBlock}\n\n${manualLines}\n`;
            }

            const newBody = before + newSection + after;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body: newBody,
            });

            console.log('✅ SYSTEM_SCAN COMPLETE — PR MANIFEST SYNCED.');