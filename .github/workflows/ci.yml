name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: read
  pull-requests: read

jobs:
  quality:
    name: Lint, Type-check, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check --if-present

      - name: Run tests
        run: npm test --if-present

      - name: Build
        run: npm run build

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: quality
    # Only run against real preview/prod URLs, not on every push to a branch with no PR
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Vercel starts building a Preview Deployment as soon as it sees the
      # push/PR. This action polls the GitHub deployment status API and
      # returns the live Preview URL once Vercel finishes building it, so we
      # test the actual deployed site instead of a local build.
      #
      # This step ONLY works if the Vercel GitHub App is installed on this
      # repo and set to post deployment statuses. If you deploy via CLI or
      # a different pipeline, this will time out at max_timeout and fail
      # the whole job — hence continue-on-error below so it doesn't block
      # the "quality" job's green check.
      - name: Wait for Vercel preview deployment
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.1
        id: waitForVercelPreview
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 300

      - name: Run Lighthouse CI
        if: steps.waitForVercelPreview.outcome == 'success'
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            ${{ steps.waitForVercelPreview.outputs.url }}
            ${{ steps.waitForVercelPreview.outputs.url }}/about
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true